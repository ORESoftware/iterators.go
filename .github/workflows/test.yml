name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  iterator-invariants:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          show-progress: false

      - name: Set up Go 1.21.5
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: "1.21.5"
          cache: false

      - name: Verify core iterator formatting
        shell: bash
        run: |
          set -euo pipefail
          files="$(gofmt -l v1/iter)"
          test -z "$files" || { printf 'gofmt required:\n%s\n' "$files" >&2; exit 1; }

      - name: Vet and race-test all packages
        run: |
          go vet ./...
          go test -race -cover ./...

      - name: Exercise iterator fuzz invariants
        run: |
          go test ./v1/iter -run='^$' -fuzz=FuzzSequence -fuzztime=3s
          go test ./v1/iter -run='^$' -fuzz=FuzzSequenceChaos -fuzztime=3s
